# https://taskfile.dev

version: "3"

tasks:
  install-deps:
    cmds:
      - scoop bucket add extras
      - scoop update
      - scoop install task kubectl busybox starship bottom dust fd fzf jq lsd procs ripgrep gsudo zoxide ghq
      - pwsh -File ./install-deps.ps1
    silent: true
  install:
    deps:
      - install-deps
    silent: true
  update:
    cmds:
      - pwsh -Command Update-Module
  clean:
    cmds:
      - rm -rf bins/
      - rm -rf init.generated.d/
